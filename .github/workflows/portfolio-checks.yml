name: Portfolio checks

on:
  pull_request:
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-checks.yml"
  push:
    branches: [master]
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-checks.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
      - run: npm run check
